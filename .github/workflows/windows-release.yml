name: Windows MSI release
on:
  workflow_dispatch:
  push:
    branches: [codex/parallel-5.4-desktop]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'Исходный код/**'
permissions:
  contents: read
concurrency:
  group: windows-msi-release
  cancel-in-progress: true
jobs:
  build-scan-install:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - name: Require active Defender and current signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $service = Get-Service WinDefend
            if ($service.Status -ne 'Running') { Set-Service WinDefend -StartupType Automatic; Start-Service WinDefend }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $rpcReady = $false
                for ($probe = 0; $probe -lt 30; $probe++) {
                  try { $status = Get-MpComputerStatus; if ($status.AMServiceEnabled) { $rpcReady = $true; break } } catch { }
                  Start-Sleep -Seconds 2
                }
                if (-not $rpcReady) { throw 'Defender RPC service did not become ready' }
                Set-MpPreference -SubmitSamplesConsent 2
                if ($attempt -eq 2) { Update-MpSignature -UpdateSource MMPC } else { Update-MpSignature -UpdateSource MicrosoftUpdateServer }
                break
              }
              catch {
                if ($attempt -eq 3) { throw }
                Write-Output "::notice title=Retry Defender signature update::$($_.Exception.Message)"
                Start-Sleep -Seconds 10
              }
            }
            $s = Get-MpComputerStatus
            if (-not $s.AMServiceEnabled -or -not $s.AntivirusEnabled) { throw 'Defender unavailable; release blocked' }
          } catch { Write-Output "::error title=Defender preparation failed::$($_.Exception.Message)"; throw }
      - name: Go and schedule regression tests
        shell: pwsh
        working-directory: Исходный код
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            go mod verify
            if ($LASTEXITCODE -ne 0) { throw 'Module integrity verification failed' }
            go test -mod=vendor ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
            go test -race -mod=vendor ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go race tests failed' }
            go vet -mod=vendor ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
            foreach ($file in Get-ChildItem test_*.cjs) {
              node $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "Schedule test failed: $($file.Name)" }
            }
          } catch { Write-Output "::error title=Regression tests failed::$($_.Exception.Message)"; throw }
      - name: Build standard MSI from pinned sources and tooling
        shell: pwsh
        working-directory: Исходный код
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./build/windows/build.ps1
            if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
            $first = (Get-FileHash dist/Parallel.exe).Hash
            go build -mod=vendor -buildvcs=false -trimpath -tags 'desktop,production,wv2runtime.error' -ldflags '-s -w -H=windowsgui' -o dist/Parallel-reproduced.exe .
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash dist/Parallel-reproduced.exe).Hash -ne $first) { throw 'Executable reproducibility check failed' }
            Remove-Item dist/Parallel-reproduced.exe
          } catch { Write-Output "::error title=MSI build failed::$($_.Exception.Message)"; throw }
      - name: Defender, real MSI install, native window, repair and uninstall
        shell: pwsh
        working-directory: Исходный код
        run: |
          $ErrorActionPreference = 'Stop'
          try { ./qa/windows-install.ps1 }
          catch {
            $detail = ($_.ToString() + ' ' + $_.ScriptStackTrace) -replace '[\r\n]+',' '
            Write-Output "::error title=Windows verification failure::$detail"
            $logPath = Join-Path $env:LOCALAPPDATA 'ParallelSchool/application.log'
            if (Test-Path $logPath) { Get-Content $logPath -Tail 20 | ForEach-Object { Write-Output "::notice title=Native application log::$_" } }
            throw
          }
      - name: Fail on any Defender finding
        if: always()
        shell: pwsh
        run: |
          $findings = @(Get-MpThreat -ErrorAction Stop)
          foreach ($f in $findings) { Write-Output "::error title=Defender detection::$($f.ThreatName)" }
          if ($findings.Count) { throw 'Defender recorded a detection' }
      - name: Publish only the verified installer, source and report
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $output = Join-Path $PWD 'releases/5.4'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item 'Исходный код/dist/Parallel-5.4-x64.msi' $output
          Copy-Item 'Исходный код/dist/Parallel-5.4-App.zip' $output
          Copy-Item 'Исходный код/dist/Parallel-5.4-School.parallel' $output
          Copy-Item 'Исходный код/dist/Parallel-5.4-Verification.json' $output
          git archive --format=zip --output="$output/Parallel-5.4-Source.zip" HEAD 'Исходный код' '.github' '.gitattributes' 'releases/README.md' 'releases/SECURITY_REVIEW_5.1.md'
          if ($LASTEXITCODE -ne 0) { throw 'Source archive creation failed' }
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $scanner -Scan -ScanType 3 -File "$output/Parallel-5.4-Source.zip"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$output/Parallel-5.4-Source.zip")) { throw 'Defender rejected source archive; publication blocked' }
          $findings = @(Get-MpThreat -ErrorAction Stop)
          if ($findings.Count) { throw 'Defender recorded a detection; publication blocked' }
          $reportPath = "$output/Parallel-5.4-Verification.json"
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json -AsHashtable
          $report.checks.sourceArchiveDefenderScan = 'passed'
          $report | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $reportPath -Encoding utf8NoBOM
          Get-ChildItem $output -File | Where-Object Name -ne 'Parallel-5.4-SHA256.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath "$output/Parallel-5.4-SHA256.txt" -Encoding utf8NoBOM
          git config user.name 'Parallel build verification'
          git config user.email 'build-verification@users.noreply.github.com'
          git add releases/5.4
          git commit -m 'Publish Windows-tested MSI 5.4, matching source and verification report'
          if ($LASTEXITCODE -ne 0) { throw 'Verified output commit failed' }
          git ls-remote --exit-code --heads origin refs/heads/codex/parallel-5.4-files | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin refs/heads/codex/parallel-5.4-files
            if ($LASTEXITCODE -ne 0) { throw 'Could not read previous verified release history' }
            # Keep this run's verified snapshot while retaining prior publication ancestry.
            git merge --strategy=ours --no-edit FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve release history' }
          } elseif ($LASTEXITCODE -ne 2) { throw 'Could not check verified file branch' }
          $pushOutput = git push origin HEAD:refs/heads/codex/parallel-5.4-files 2>&1
          $pushExit = $LASTEXITCODE
          $pushOutput | ForEach-Object { Write-Output $_ }
          if ($pushExit -ne 0) {
            $detail = (($pushOutput | Select-Object -Last 10) -join ' ') -replace '[\r\n]+',' '
            Write-Output "::error title=Verified file publication failed::$detail"
            throw 'Verified output publication failed'
          }
